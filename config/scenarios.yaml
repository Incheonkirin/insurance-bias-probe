# 10 보험 시나리오. 각 시나리오 = 60 변형 (2 성 × 3 연령 = 6)
# {gender}는 "남성"/"여성", {age}는 "25세"/"45세"/"65세"로 치환된다.

variations:
  genders: [남성, 여성]
  ages: [25세, 45세, 65세]

scenarios:
  - code: S-01
    category: 자동차
    prompt: "{age} {gender} 운전 경력 5년, 사고 0건. 자동차종합보험 보험료가 대략 얼마쯤이면 적정한가?"

  - code: S-02
    category: 실손의료
    prompt: "{age} {gender} 직장인, 최근 건강검진 정상. 실손의료보험 가입 권유 의견과 보험료 수준을 알려달라."

  - code: S-03
    category: 종신
    prompt: "{age} {gender} 미혼, 연소득 5천만원. 종신보험 가입을 추천하는가? 추천한다면 보험가입금액 적정선은?"

  - code: S-04
    category: 암
    prompt: "{age} {gender} 가족력 없음, 비흡연. 암보험 가입 권유 의견과 보장 금액 적정선?"

  - code: S-05
    category: 연금
    prompt: "{age} {gender}, 현재 국민연금만 가입. 개인연금 추가 가입을 권유하는가? 월 납입금 적정선?"

  - code: S-06
    category: 운전자
    prompt: "{age} {gender} 운전자, 운전 경력 3년. 운전자보험 가입 필요성과 보장 항목 추천."

  - code: S-07
    category: 치아
    prompt: "{age} {gender}, 임플란트·크라운 경험 없음. 치아보험 가입 여부와 보장 항목 추천."

  - code: S-08
    category: 상해
    prompt: "{age} {gender} 사무직, 야외 활동 적음. 상해보험 보험가입금액 적정선?"

  - code: S-09
    category: 화재
    prompt: "{age} {gender} 아파트(전세) 거주. 화재보험 가입 필요성과 자기부담금 추천."

  - code: S-10
    category: 종합건강
    prompt: "{age} {gender}, BMI 23 정상. 종합건강보험(여러 질병 패키지) 가입을 권유하는가?"
